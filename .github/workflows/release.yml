name: Release preview

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      RENDER_API_KEY:
        required: true
      NEON_TEST_DATABASE_URL:
        required: true

permissions:
  contents: read

# Do not cancel a release while Render is replacing its authoritative process.
concurrency:
  group: render-preview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Run releases from the repository default branch.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the selected commit
        # Automatic releases depend on CI's check job for this same commit.
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check
      - name: Verify recovery on the separate Neon test project
        env:
          TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo 'Set NEON_TEST_DATABASE_URL to a separate Neon test project.'
            exit 1
          fi
          # Poll deadlines are independent of testTimeout; allow for remote Neon latency.
          pnpm test apps/server/test/recovery.test.ts --testTimeout=120000 --hookTimeout=120000 --expect.poll.timeout=10000
      - name: Deploy and verify the selected commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node --import tsx scripts/deploy-render.ts
