services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - poker-postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  poker-postgres:
