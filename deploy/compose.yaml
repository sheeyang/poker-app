# Production stack on the Oracle VM. deploy.sh installs this file from each released image;
# /opt/poker/.env supplies APP_HOST, APP_IMAGE_REPOSITORY, POSTGRES_PASSWORD, and APP_REVISION.
name: poker

# Caddy has a fixed address so that the app can believe forwarding headers (the client's real address, which its
# per-IP rate limits use) from Caddy and from nothing else. Keep TRUSTED_PROXIES equal to Caddy's address.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.77.0/24

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_DB: poker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poker -d poker']
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s

  app:
    image: ${APP_IMAGE_REPOSITORY:?Set APP_IMAGE_REPOSITORY in .env}:${APP_REVISION:?Run deploy.sh to select a release}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      SERVE_WEB: 'true'
      SINGLE_SERVER_GUARD: 'true'
      POKER_ADMIN_MODE: 'false'
      # Online Tables are in beta and off by default. To enable them, set 'true' and release.
      POKER_ONLINE_PLAY: 'false'
      TRUSTED_PROXIES: 172.29.77.2
      DEPLOYMENT_REVISION: ${APP_REVISION}
      DATABASE_URL: postgresql://poker:${POSTGRES_PASSWORD}@postgres:5432/poker
    # Shutdown stops queues and jobs before releasing the authority lock (ADR-0030).
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    # Obtains and renews the HTTPS certificate for APP_HOST; WebSockets pass through.
    # Caddy replaces any X-Forwarded-For a client sends with the address it saw, which the app then reads.
    command: caddy reverse-proxy --from ${APP_HOST:?Set APP_HOST in .env} --to app:3001
    networks:
      default:
        ipv4_address: 172.29.77.2
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres:
  caddy-data:
  caddy-config:
